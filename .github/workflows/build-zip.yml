name: Build Extension Packages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build browser packages
        run: make chrome firefox

      - name: Upload Chrome zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindmap-exporter-chrome
          path: dist/mindmap-exporter-chrome.zip

      - name: Upload Firefox zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindmap-exporter-firefox
          path: dist/mindmap-exporter-firefox.zip
